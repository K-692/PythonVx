name: 'Release'

# Builds the installers for Windows, macOS (Apple Silicon + Intel) and Linux
# and attaches them to a published GitHub Release.
#   git tag v1.0.0 && git push origin v1.0.0
# It can also be started by hand from the Actions tab (enter the tag to build).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            rust-targets: ''
          - platform: 'ubuntu-22.04'
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './python-visualizer/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './python-visualizer/src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Python (for the tracer smoke test)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tracer smoke test
        shell: bash
        run: python python-visualizer/src-tauri/python/test_tracer.py

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./python-visualizer

      # The macOS app is ad-hoc signed (bundle.macOS.signingIdentity = "-").
      # To ship a notarized build, add the APPLE_* secrets and pass them here
      # (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID).
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'PythonVx ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Download the installer for your computer below.

            | System | File |
            | --- | --- |
            | Windows | `PythonVx_*_x64-setup.exe` (recommended) or `PythonVx_*_x64_en-US.msi` |
            | macOS – Apple Silicon (M1/M2/M3/M4) | `PythonVx_*_aarch64.dmg` |
            | macOS – Intel | `PythonVx_*_x64.dmg` |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            PythonVx uses the Python 3.8+ already installed on your computer (https://www.python.org/downloads/).
            On macOS, if you see "PythonVx can't be opened", right-click the app and choose **Open** (or run `xattr -cr /Applications/PythonVx.app`).
          releaseDraft: false
          prerelease: false
          projectPath: './python-visualizer'
          args: ${{ matrix.args }}
